<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/captions-data.js"></script>
    <style>
      :root {
        --indigo: #07172e;
        --famu-green: #215732;
        --white: #ffffff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--indigo);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--indigo);
        isolation: isolate;
      }

      #source-video {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }

      #caption-layer {
        position: absolute;
        left: 54px;
        right: 54px;
        bottom: 235px;
        height: 230px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .caption-group {
        position: absolute;
        left: 0;
        right: 0;
        min-height: 92px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 2px 4px;
        padding: 16px 22px;
        border: 2px solid rgba(255, 255, 255, 0.16);
        border-radius: 22px;
        background: rgba(7, 23, 46, 0.82);
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.38);
        color: var(--white);
        font-family: "Montserrat", sans-serif;
        font-size: 58px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -1px;
        text-align: center;
        text-shadow: 0 2px 7px rgba(0, 0, 0, 0.92);
        opacity: 0;
        visibility: hidden;
      }

      .caption-word {
        display: inline-block;
        padding: 4px 8px 6px;
        border-radius: 10px;
        color: var(--white);
        background: rgba(33, 87, 50, 0);
        transform-origin: center;
        will-change: transform, background-color, box-shadow;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="week-01-day-01-captioned"
      data-start="0"
      data-duration="360.043"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="source-video"
        class="clip"
        data-start="0"
        data-duration="360.043"
        data-track-index="1"
        data-volume="1"
        data-has-audio="true"
        src="assets/source-video.mp4"
        preload="auto"
        playsinline
      ></video>
      <div id="caption-layer" data-layout-allow-overlap></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const groups = window.CAPTION_GROUPS || [];
      const captionLayer = document.getElementById("caption-layer");

      groups.forEach((group, groupIndex) => {
        const groupElement = document.createElement("div");
        groupElement.id = `caption-group-${groupIndex}`;
        groupElement.className = "caption-group";
        groupElement.setAttribute("data-layout-allow-overlap", "");

        group.words.forEach((word, wordIndex) => {
          const wordElement = document.createElement("span");
          wordElement.id = `caption-word-${groupIndex}-${wordIndex}`;
          wordElement.className = "caption-word";
          wordElement.textContent = word.text;
          groupElement.appendChild(wordElement);
        });

        captionLayer.appendChild(groupElement);
      });

      const tl = gsap.timeline({ paused: true });

      groups.forEach((group, groupIndex) => {
        const groupSelector = `#caption-group-${groupIndex}`;
        tl.set(
          groupSelector,
          { opacity: 1, visibility: "visible", y: 0 },
          group.show,
        );

        group.words.forEach((word, wordIndex) => {
          const wordSelector = `#caption-word-${groupIndex}-${wordIndex}`;
          tl.set(
            wordSelector,
            {
              backgroundColor: "#215732",
              boxShadow: "0 0 0 3px rgba(255,255,255,0.24)",
              scale: 1.055,
            },
            word.start,
          );
          tl.set(
            wordSelector,
            {
              backgroundColor: "rgba(33,87,50,0)",
              boxShadow: "0 0 0 0 rgba(255,255,255,0)",
              scale: 1,
            },
            word.end,
          );
        });

        tl.set(
          groupSelector,
          { opacity: 0, visibility: "hidden" },
          group.hide,
        );
      });

      groups.forEach((group, groupIndex) => {
        const element = document.getElementById(`caption-group-${groupIndex}`);
        tl.seek(group.hide + 0.01);
        const computed = window.getComputedStyle(element);
        if (computed.opacity !== "0" && computed.visibility !== "hidden") {
          console.warn(`[caption-lint] group ${groupIndex} remains visible after exit`);
        }
      });
      tl.seek(0);

      window.__timelines["week-01-day-01-captioned"] = tl;
    </script>
  </body>
</html>
